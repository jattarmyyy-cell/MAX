<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{min-height:100vh;background:#0E0E1E;display:flex;justify-content:center;align-items:center;padding:20px}
.card{width:100%;max-width:380px;background:#12121F;border:1px solid #232334;border-radius:24px;padding:28px 22px;text-align:center}
.avatar-wrap{width:112px;height:112px;margin:0 auto;position:relative;border-radius:50%;padding:3px;background:linear-gradient(135deg,#A855F7,#F59E0B)}
.avatar-wrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #12121F;display:block}
.tick{position:absolute;right:-2px;bottom:5px;width:28px;height:28px;background:#FFC94A;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #12121F;font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#1E1E08;border:1px solid #FFC94A;color:#FFC94A;font-size:11px;letter-spacing:1.5px;font-weight:700;padding:6px 16px;border-radius:999px;margin-top:18px}
h1{color:#fff;font-size:30px;font-weight:800;margin-top:14px}
.line{width:70px;height:3px;background:linear-gradient(to right,#A855F7,#F59E0B);margin:4px auto 0;border-radius:999px}
.sub{color:#8B8BA7;font-size:13.5px;margin-top:12px}
.sub b{color:#FFC94A}
.members{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:13px;color:#8B8BA7}
.dots{display:flex;margin-right:4px}
.dots div{width:28px;height:28px;border-radius:50%;border:2px solid #12121F;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;margin-left:-8px}
.dots div:first-child{margin-left:0;background:#232334}
.dots div:nth-child(2){background:#2a2a45}
.dots div:nth-child(3){background:#3a3a5a}
.btn{width:100%;margin-top:20px;background:linear-gradient(to right,#7C3AED,#C084FC);color:#fff;padding:15px;border-radius:12px;font-size:14px;font-weight:800;border:none;cursor:pointer;letter-spacing:0.5px}
.hint{color:#5a5a7a;font-size:10px;margin-top:8px}
.timer-out{margin:28px auto 0;width:110px;height:110px;border-radius:50%;background:conic-gradient(#A855F7 0% 70%,#232334 70% 100%);display:flex;align-items:center;justify-content:center;padding:3px}
.timer-in{width:96px;height:96px;background:#12121F;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer-in b{color:#fff;font-size:34px;line-height:1}
.timer-in span{color:#8B8BA7;font-size:9px;text-transform:uppercase;margin-top:2px}
.rem{color:#8B8BA7;font-size:11px;margin-top:12px}
.live{color:#22c55e;font-size:11px;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:6px}
.live i{width:8px;height:8px;background:#22c55e;border-radius:50%;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
<body>
<div class="card">
  <div class="avatar-wrap">
    <img src="avatar.jpg" onerror="this.src='https://i.pravatar.cc/300'" alt="MAX">
    <div class="tick">✓</div>
  </div>
  <div class="badge">★ BEST CHANNEL</div>
  <h1>MAX REAL VIP</h1>
  <div class="line"></div>
  <p class="sub">Enter the guild. <b>Premium signals</b> await.</p>
  <div class="members">
    <div class="dots"><div>R</div><div>M</div><div>S</div></div>
    <span>40000+ members joined</span>
  </div>
  <button id="joinBtn" class="btn">JOIN TELEGRAM ➤</button>
  <p class="hint">tap to open</p>
  <div class="timer-out"><div class="timer-in"><b id="count">3</b><span>SECONDS</span></div></div>
  <p class="rem"><span id="remText">3 seconds remaining</span></p>
  <p class="live"><i></i> Live now</p>
</div>

<script>
const TELEGRAM_LINK = "https://t.me/+XsqTjnFdOVcwNGQ1";
let c = 3;
const countEl = document.getElementById('count');
const remText = document.getElementById('remText');

function go(){
  if(sessionStorage.getItem("joined")) return;
  sessionStorage.setItem("joined","1");
  window.location.href = TELEGRAM_LINK;
}

const interval = setInterval(()=>{
  c--;
  if(c<=0){
    clearInterval(interval);
    countEl.textContent = "0";
    remText.textContent = "Redirecting...";
    go();
  } else {
    countEl.textContent = c;
    remText.textContent = c + " seconds remaining";
  }
},1000);

document.getElementById('joinBtn').addEventListener('click',()=>{
  fbq('track','Lead');
  fbq('track','Subscribe');
  sessionStorage.setItem("joined","1");
  window.open(TELEGRAM_LINK,"_blank");
});
</script>
</body>
